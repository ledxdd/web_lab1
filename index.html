<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа 1</title>
    <style>
        .shapka {
            font-family: serif;
            font-size: 20px;
            color: #003366;
            margin-bottom: 20px;
        }

        .main-container {
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;     
            gap: 20px;                
        }

        .column {
            flex: 1;
        }
    </style>
</head>
<body>

    <header class="shapka">
        <p>Козлов Владислав Петрович</p>
        <p>Группа Р3207</p>
        <p>Вариант 12620</p>
        <img src="https://i.pinimg.com/736x/05/5e/31/055e316189a49c2829830164a66b0d53.jpg" width=100, height=100>
    </header>

    <div class="main-container">
        
        <div class="column">
            <h3>Ввод</h3>
            <p>
                X: <input type="text" placeholder="-3 ... 3" style="width: 80px;">
            </p>
            <p>Y:
                <input type="radio" name="y_val" value="-3">-3
                <input type="radio" name="y_val" value="-2">-2
                <input type="radio" name="y_val" value="-1">-1
                <input type="radio" name="y_val" value="0">0
                <input type="radio" name="y_val" value="1">1
                <input type="radio" name="y_val" value="2">2
                <input type="radio" name="y_val" value="3">3
                <input type="radio" name="y_val" value="4">4
                <input type="radio" name="y_val" value="5">5
            </p>
            <p>
                R: 
                <button type="button">1</button>
                <button type="button">2</button>
                <button type="button">3</button>
                <button type="button">4</button>
                <button type="button">5</button>
            </p>
        </div>

        <div class="column">
            <h3>Картинка</h3>
            <canvas id="canvas" width="300" height="300"></canvas>

            <script>
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const tickLength = 4;
            const R = 120;

            ctx.fillStyle = '#3399ff'; 

            ctx.fillRect(centerX, centerY - R, R, R);

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX - R, centerY);
            ctx.lineTo(centerX, centerY - R);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);

            ctx.arc(centerX, centerY, R / 2, 0, Math.PI / 2);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#000';
            
            ctx.beginPath();

            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);

            ctx.moveTo(width - 10, centerY - 5);
            ctx.lineTo(width, centerY);
            ctx.lineTo(width - 10, centerY + 5);

            ctx.moveTo(centerX, height);
            ctx.lineTo(centerX, 0);

            ctx.moveTo(centerX - 5, 10);
            ctx.lineTo(centerX, 0);
            ctx.lineTo(centerX + 5, 10);

            ctx.stroke();


        </script>
        </div>

        <div class="column">
            <h3> Таблица результатов </h3>
            <table id="restable">
                <thead>
                    <tr>
                        <th>X</th>
                        <th>Y</th>
                        <th>R</th>
                        <th>Результат</th>
                    </tr>
                </thead>

                <tbody>
                    
            </table>
            
        </div>

    </div>

</body>
</html>
